{{ define "main" }}
<div class="content-wrapper">
  <div class="content-body section-tags">
    <h1>{{ i18n (printf "taxonomy_%s" .Data.Plural) | default .Title }}</h1>
    
    {{ if .Pages }}
    <div class="tags-cloud">
      {{ range .Pages }}
      <a href="{{ .Permalink }}" class="tag">
        {{ .Data.Term }} <span class="tag-count-badge">{{ len .Pages }}</span>
      </a>
      {{ end }}
    </div>
    {{ else }}
    <p>{{ i18n "no_tags" }}</p>
    {{ end }}
  </div>
</div>
{{ end }}
